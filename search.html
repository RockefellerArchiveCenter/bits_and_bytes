---
layout: default
title: Search results
description: Results for a keyword search of Bits & Bytes blog posts.
---

<h1 class="title">Search results</h1>

<p id="search-status" role="status"></p>

{% include search_form.html %}

<div id="search-results"></div>
<p id="not-found" style="display: none">
    {{ site.theme_settings.str_search_no_results }}
</p>


<script>
  window.store = {
    {% for post in site.posts %}
      {% capture byline %}{% include byline.html author=post.author %}{% endcapture %}
      "{{ post.url | slugify }}": {
        "title": "{{ post.title | xml_escape }}",
        "tags": "{{ post.tags | join: ', ' }}",
        "date": "{{ post.date | date: '%B %-d, %Y' }}",
        "author": "{{ post.author | join: ', ' | xml_escape }}",
        "category": "{{ post.categories | join: ', ' | xml_escape }}",
        "content": {{ post.content | strip_html | strip_newlines | jsonify }},
        "byline": {{ byline | strip | jsonify }},
        "excerpt": {{ post.excerpt | jsonify }},
        "url": "{{ post.url | relative_url }}"
      }
      {% unless forloop.last %},{% endunless %}
    {% endfor %}
  };
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/0.7.1/lunr.min.js"></script>
<script src="{{ site.baseurl }}/assets/js/search.js"></script>
